[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ziaxen-sensor-noise-agent"
version = "1.0.0"
description = "Recorded-data sensor-noise anomaly detection for the Ziaxen dataset"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "scikit-learn>=1.4,<2",
  "matplotlib>=3.8,<4",
  "joblib>=1.3,<2",
]

[project.scripts]
ziaxen-agent = "ziaxen_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
